<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="menuGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
  </defs>

  <g stroke="url(#menuGrad)" stroke-width="3" stroke-linecap="round">
    <!-- Obere Linie -->
    <line x1="8" y1="12" x2="40" y2="12">
      <animate attributeName="x2" dur="0.3s" fill="freeze" values="40;40"/>
    </line>
    <!-- Mittlere Linie -->
    <line x1="8" y1="24" x2="40" y2="24"/>
    <!-- Untere Linie -->
    <line x1="8" y1="36" x2="40" y2="36">
      <animate attributeName="x2" dur="0.3s" fill="freeze" values="34;34"/>
    </line>
  </g>

  <!-- Kleine dekorative Punkte an den Enden -->
  <g fill="#ffd700" opacity="0.4">
    <circle cx="8" cy="12" r="1"/>
    <circle cx="40" cy="12" r="1"/>
    <circle cx="8" cy="24" r="1"/>
    <circle cx="40" cy="24" r="1"/>
    <circle cx="8" cy="36" r="1"/>
    <circle cx="34" cy="36" r="1"/>
  </g>
</svg>

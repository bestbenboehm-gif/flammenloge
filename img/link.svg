<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="linkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#d4a853"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <filter id="linkGlow">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <g filter="url(#linkGlow)">
    <!-- Oberes Kettenglied -->
    <g stroke="url(#linkGrad)" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M22 12 C22 6 28 4 32 8 C34 10 34 14 32 16 L28 20 C26 22 22 22 20 20"/>
    </g>
    <!-- Unteres Kettenglied -->
    <g stroke="url(#linkGrad)" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M26 36 C26 42 20 44 16 40 C14 38 14 34 16 32 L20 28 C22 26 26 26 28 28"/>
    </g>
    <!-- Verbindungsring -->
    <circle cx="24" cy="24" r="4" stroke="url(#linkGrad)" stroke-width="2" fill="none"/>
    <circle cx="24" cy="24" r="1.5" fill="url(#linkGrad)" opacity="0.4"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0705" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1a1508" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2a1f0e" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="moonGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff8dc"/>
      <stop offset="80%" stop-color="#d4a853"/>
      <stop offset="100%" stop-color="#a6782800"/>
    </radialGradient>
    <filter id="moonGlow">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Mondschein-Reflexion auf Wasser -->
  <ellipse cx="24" cy="36" rx="12" ry="4" fill="url(#moonGrad)" opacity="0.1" filter="url(#moonGlow)">
    <animate attributeName="rx" dur="4s" repeatCount="indefinite" values="12;14;12"/>
  </ellipse>

  <!-- Mond -->
  <g filter="url(#moonGlow)">
    <!-- Vollmond -->
    <circle cx="24" cy="18" r="10" fill="url(#moonGrad)" opacity="0.8"/>
    <!-- Mondkrater (subtil) -->
    <circle cx="20" cy="16" r="2" fill="#d4a853" opacity="0.1"/>
    <circle cx="27" cy="20" r="1.5" fill="#d4a853" opacity="0.1"/>
    <circle cx="22" cy="22" r="1" fill="#d4a853" opacity="0.08"/>
  </g>

  <!-- Wasserlinie -->
  <g stroke="#d4a853" stroke-width="0.4" opacity="0.2">
    <path d="M4 32 Q10 30 16 32 Q22 34 28 32 Q34 30 40 32 Q44 34 48 32">
      <animate attributeName="d" dur="5s" repeatCount="indefinite" 
        values="M4 32 Q10 30 16 32 Q22 34 28 32 Q34 30 40 32 Q44 34 48 32;
                M4 33 Q10 31 16 33 Q22 35 28 33 Q34 31 40 33 Q44 35 48 33;
                M4 32 Q10 30 16 32 Q22 34 28 32 Q34 30 40 32 Q44 34 48 32"/>
    </path>
    <path d="M4 36 Q10 34 16 36 Q22 38 28 36 Q34 34 40 36 Q44 38 48 36">
      <animate attributeName="d" dur="5s" repeatCount="indefinite" begin="0.5s"
        values="M4 36 Q10 34 16 36 Q22 38 28 36 Q34 34 40 36 Q44 38 48 36;
                M4 35 Q10 33 16 35 Q22 37 28 35 Q34 33 40 35 Q44 37 48 35;
                M4 36 Q10 34 16 36 Q22 38 28 36 Q34 34 40 36 Q44 38 48 36"/>
    </path>
    <path d="M4 40 Q10 38 16 40 Q22 42 28 40 Q34 38 40 40 Q44 42 48 40">
      <animate attributeName="d" dur="5s" repeatCount="indefinite" begin="1s"
        values="M4 40 Q10 38 16 40 Q22 42 28 40 Q34 38 40 40 Q44 42 48 40;
                M4 39 Q10 37 16 39 Q22 41 28 39 Q34 37 40 39 Q44 41 48 39;
                M4 40 Q10 38 16 40 Q22 42 28 40 Q34 38 40 40 Q44 42 48 40"/>
    </path>
  </g>

  <!-- Stille Sterne -->
  <g fill="#ffd700" opacity="0.3">
    <circle cx="8" cy="8" r="0.5"/>
    <circle cx="38" cy="6" r="0.4"/>
    <circle cx="12" cy="28" r="0.3"/>
    <circle cx="40" cy="24" r="0.4"/>
    <circle cx="6" cy="18" r="0.3"/>
  </g>

  <!-- Mondspiegelung auf Wasser -->
  <g opacity="0.25">
    <ellipse cx="24" cy="34" rx="6" ry="2" fill="#fff8dc" filter="url(#moonGlow)">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.25;0.4;0.25"/>
    </ellipse>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 24" fill="none">
  <defs>
    <linearGradient id="ornGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff450000"/>
      <stop offset="15%" stop-color="#ff8c00"/>
      <stop offset="35%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#fff8dc"/>
      <stop offset="65%" stop-color="#ffd700"/>
      <stop offset="85%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ff450000"/>
    </linearGradient>
    <filter id="ornGlow">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <g stroke="url(#ornGrad)" fill="none">
    <!-- Hauptlinie -->
    <line x1="10" y1="12" x2="190" y2="12" stroke-width="0.8" opacity="0.4"/>

    <!-- Linke Ornamentik – Wikinger-Knoten-Stil -->
    <g stroke-width="0.6" opacity="0.6">
      <!-- Äußerer Bogen -->
      <path d="M10 12 Q15 4 25 6 Q35 8 30 12"/>
      <path d="M10 12 Q15 20 25 18 Q35 16 30 12"/>
      <!-- Innerer Bogen -->
      <path d="M18 12 Q22 6 28 8"/>
      <path d="M18 12 Q22 18 28 16"/>
      <!-- Abschluss -->
      <circle cx="10" cy="12" r="1.5" fill="url(#ornGrad)" stroke="none"/>
    </g>

    <!-- Mittlere Verzierung – Flammenmotiv -->
    <g filter="url(#ornGlow)">
      <!-- Flamme Mitte -->
      <path d="M93 14 C92 10 95 7 98 8 C100 5 103 7 104 10 C106 8 108 10 107 14 C106 18 100 20 100 20 C100 20 94 18 93 14Z" 
            fill="url(#ornGrad)" stroke="none" opacity="0.8"/>
      <!-- Flammenkern -->
      <path d="M98 12 C97 10 99 8 100 9 C101 8 103 10 102 12 C101 14 100 15 100 15 C100 15 99 14 98 12Z" 
            fill="#fff8dc" stroke="none" opacity="0.6"/>
      <!-- Seitliche Funken -->
      <circle cx="90" cy="10" r="0.8" fill="#ffd700" stroke="none" opacity="0.5"/>
      <circle cx="110" cy="10" r="0.8" fill="#ffd700" stroke="none" opacity="0.5"/>
    </g>

    <!-- Rechte Ornamentik -->
    <g stroke-width="0.6" opacity="0.6">
      <path d="M170 12 Q175 4 185 6 Q195 8 190 12"/>
      <path d="M170 12 Q175 20 185 18 Q195 16 190 12"/>
      <path d="M178 12 Q182 6 188 8"/>
      <path d="M178 12 Q182 18 188 16"/>
      <circle cx="190" cy="12" r="1.5" fill="url(#ornGrad)" stroke="none"/>
    </g>
  </g>
</svg>
